[project]
name = "agent-scheduler-testbed"
version = "0.1.0"
description = "Coding-agent workload testbed: SWE-bench -> OpenCode -> Dynamo -> vLLM PD"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "httpx-sse>=0.4",
    "datasets>=2.18",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "click>=8.1",
    "opentelemetry-api>=1.24",
    "anyio>=4.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
testbed = "testbed.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
